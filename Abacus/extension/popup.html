<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 300px; margin: 0; padding: 14px 16px;
         background: #14171d; color: #f2f4f8; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  #state { color: #8a93a6; margin-bottom: 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #ef6f6c; }
  .dot.on { background: #7bd88f; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid #2a2f3a; }
  li small { color: #8a93a6; display: block; }
  p { color: #8a93a6; margin: 10px 0 0; }
</style>
<h1>Abacus Tweaks</h1>
<div id="state"></div>
<ul id="list"></ul>
<p>Say "Abacus, undo the ... change" to remove one.</p>
<script src="popup.js"></script>
